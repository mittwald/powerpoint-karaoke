services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://powerpoint:powerpoint@db:5432/powerpoint_karaoke
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://llm.aihosting.mittwald.de/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-oss-120b}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-in-production}
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - powerpoint-network

  db:
    # Pinned to a minor version; bumping it (especially the major) is a
    # deliberate change. See the volume comment below before doing so.
    image: postgres:18.6-alpine
    environment:
      - POSTGRES_USER=powerpoint
      - POSTGRES_PASSWORD=powerpoint
      - POSTGRES_DB=powerpoint_karaoke
    volumes:
      # Postgres 18+ images keep PGDATA in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the volume MUST be mounted at
      # /var/lib/postgresql. Mounting it at the pre-18 path
      # /var/lib/postgresql/data makes the container refuse to start.
      # Do not work around this by setting PGDATA to the legacy path either;
      # initdb then aborts because the existing 18/ subtree is in the way.
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerpoint -d powerpoint_karaoke"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - powerpoint-network

volumes:
  postgres-data:
    driver: local

networks:
  powerpoint-network:
    driver: bridge
