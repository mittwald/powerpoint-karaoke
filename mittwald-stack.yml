services:
  app:
    description: PowerPoint Karaoke
    image: "{{ .Env.IMAGE_TAG }}"
    ports:
      - "3000:3000"
    envs:
      NODE_ENV: production
      DATABASE_URL: postgresql://powerpoint:{{ .Env.POSTGRES_PASSWORD }}@db:5432/powerpoint_karaoke
      OPENAI_API_KEY: {{ .Env.OPENAI_API_KEY }}
      OPENAI_API_BASE_URL: https://llm.aihosting.mittwald.de/v1
      OPENAI_MODEL: gpt-oss-120b
      UNSPLASH_ACCESS_KEY: {{ .Env.UNSPLASH_ACCESS_KEY }}
      SESSION_SECRET: {{ .Env.SESSION_SECRET }}

  db:
    description: PostgreSQL Database
    # Pinned to a minor version; bumping it (especially the major) is a
    # deliberate change. See the volume comment below before doing so.
    image: postgres:18.6-alpine
    envs:
      POSTGRES_USER: powerpoint
      POSTGRES_PASSWORD: {{ .Env.POSTGRES_PASSWORD }}
      POSTGRES_DB: powerpoint_karaoke
    volumes:
      # Postgres 18+ images keep PGDATA in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the volume MUST be mounted at
      # /var/lib/postgresql. Mounting it at the pre-18 path
      # /var/lib/postgresql/data makes the container refuse to start.
      # Do not work around this by setting PGDATA to the legacy path either;
      # initdb then aborts because the existing 18/ subtree is in the way.
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  postgres-data:
    name: postgres-data